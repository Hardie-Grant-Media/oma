name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
      - run: npm run build:hosted
        env:
          OMA_BASE_PATH: /oma/
          VITE_OMA_MCP_CLIENT_IDS: ${{ vars.OMA_MCP_CLIENT_IDS }}
          VITE_DEMO: 'false'
          VITE_SUPABASE_URL: https://kwnpjfrxusfimzcodlpp.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ vars.OMA_SUPABASE_PUBLIC_KEY }}
          VITE_REPORT_READER_URL: https://kwnpjfrxusfimzcodlpp.supabase.co/functions/v1/report-reader
      - run: node scripts/prepare-pages.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
